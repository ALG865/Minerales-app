name: Generar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME
      - name: Instalar Capacitor
        run: npm install
      - name: Crear proyecto Android
        run: |
          npx cap add android
          cp android-extra/MainActivity.java android/app/src/main/java/es/csic/mineralesestrategicos/MainActivity.java
          npx cap sync android
      - name: Firma fija y número de versión
        run: |
          mkdir -p ~/.android
          cp android-extra/debug.keystore ~/.android/debug.keystore
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk minerales-estrategicos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minerales-estrategicos-apk
          path: minerales-estrategicos.apk
      - name: Publicar en «Releases» (descarga directa desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: prueba-${{ github.run_number }}
          name: Minerales estratégicos — prueba ${{ github.run_number }}
          body: APK de prueba (fluorita y calcopirita). Descárgalo desde el móvil y ábrelo para instalarlo.
          files: minerales-estrategicos.apk
          make_latest: true
