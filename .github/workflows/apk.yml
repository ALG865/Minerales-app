name: Generar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Comprobar Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls $ANDROID_HOME
      - name: Instalar Capacitor
        run: npm install
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk minerales-estrategicos.apk
      - uses: actions/upload-artifact@v4
        with:
          name: minerales-estrategicos-apk
          path: minerales-estrategicos.apk
